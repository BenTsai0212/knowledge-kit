<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>時間軸</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2340C8}a:hover{color:#14171A}
</style>
</helmet>
<div style="width: 100%; min-height: 1000px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, 'Noto Sans TC', sans-serif; display: flex; flex-wrap: wrap; align-items: stretch">

  <nav aria-label="頁面" style="flex: 1 1 200px; max-width: 220px; box-sizing: border-box; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; background: {{t.surface}}; border-right: 1px solid {{t.line}}">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 16px">
      <svg width="28" height="28" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="11" fill="{{t.raised}}"></rect><path d="M17 12v24M17 24 32 13.5M17 24l15 10.5" fill="none" stroke="{{t.text}}" stroke-width="4.5" stroke-linecap="round"></path><circle cx="32" cy="34.5" r="5" fill="{{t.primary}}"></circle><circle cx="32" cy="13.5" r="5" fill="{{t.evid}}"></circle></svg>
      <span style="font-size: 16px; font-weight: 900">範例公司</span>
    </div>
    <a href="#" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; color: {{t.text}}; text-decoration: none; font-size: 15px">問答</a>
    <a href="#" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; color: {{t.text}}; text-decoration: none; font-size: 15px">圖譜</a>
    <a href="#" aria-current="page" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; background: {{t.inkBg}}; color: {{t.inkFg}}; text-decoration: none; font-size: 15px; font-weight: 700">時間軸</a>
    <a href="#" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; color: {{t.text}}; text-decoration: none; font-size: 15px">上傳</a>
    <a href="#" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; color: {{t.text}}; text-decoration: none; font-size: 15px">評測台</a>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; border: 1px dashed {{t.dash}}">
      <span style="font-size: 12px; color: {{t.muted}}">虛構資料 · 展示用權限</span>
      <span style="display: inline-flex; align-items: center; height: 32px; padding: 0 10px; border-radius: 999px; background: {{t.inkBg}}; color: {{t.inkFg}}; font-size: 13px; font-weight: 700; align-self: flex-start">身分 · 一般員工</span>
    </div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px clamp(16px, 4vw, 56px); display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700">時間軸</h1>
      <span style="font-size: 14px; color: {{t.muted}}">2026 年 1 月 – 5 月 · 5 份文件</span>
      <button type="button" onClick="{{toggleDark}}" aria-pressed="{{darkPressed}}" style="margin-left: auto; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.text}}; font: 600 13px Inter, 'Noto Sans TC', sans-serif">{{modeLabel}}</button>
    </div>

    <div role="group" aria-label="依實體篩選" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
      <span style="font-size: 13px; color: {{t.muted}}; margin-right: 4px">依實體篩選</span>
      <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.text}}; font: 14px Inter, 'Noto Sans TC', sans-serif">全部</button>
      <button type="button" aria-pressed="true" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid {{t.primary}}; background: {{t.primarySoft}}; color: {{t.text}}; font: 600 14px Inter, 'Noto Sans TC', sans-serif"><span style="width: 10px; height: 10px; border-radius: 2px; background: {{t.eProject}}"></span>青翼專案</button>
      <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.text}}; font: 14px Inter, 'Noto Sans TC', sans-serif"><span style="width: 10px; height: 10px; border-radius: 999px; background: {{t.ePerson}}"></span>王小明</button>
      <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.text}}; font: 14px Inter, 'Noto Sans TC', sans-serif"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.eTeam}}"></span>產品研發部</button>
    </div>

    <ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 72px 24px minmax(0, 1fr); column-gap: 16px; row-gap: 0">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="9">
        <li style="display: contents">
          <span style="padding-top: 18px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.muted}}; text-align: right">{{it.date}}</span>
          <span style="position: relative; display: flex; justify-content: center">
            <span style="position: absolute; top: 0; bottom: 0; width: 2px; background: {{t.line}}"></span>
            <span style="position: relative; margin-top: 20px; width: 12px; height: 12px; border-radius: 999px; background: {{it.dot}}; box-shadow: 0 0 0 4px {{t.bg}}"></span>
          </span>
          <div style="padding: 8px 0">
            <sc-if value="{{it.doc}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 18px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.line}}; opacity: {{it.opacity}}">
                <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
                  <span style="font-size: 16px; font-weight: 700">{{it.title}}</span>
                  <span style="font-size: 12px; padding: 2px 8px; border-radius: 6px; background: {{t.raised}}; color: {{t.muted}}">{{it.vis}}</span>
                  <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 2px 6px; border-radius: 6px; border: 1px solid {{t.line}}; color: {{t.muted}}">{{it.lang}}</span>
                </div>
                <sc-if value="{{it.hasNote}}" hint-placeholder-val="{{ false }}">
                  <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; background: {{t.conflictSoft}}; color: {{t.conflictText}}; font-size: 13px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 4v16M17 4v16M3 8h8M13 16h8"></path></svg>{{it.note}}</span>
                </sc-if>
                <sc-if value="{{it.hasEnt}}" hint-placeholder-val="{{ false }}">
                  <span style="font-size: 13px; color: {{t.muted}}">提到：{{it.ent}}</span>
                </sc-if>
              </div>
            </sc-if>
            <sc-if value="{{it.locked}}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px; border-radius: 14px; border: 1.5px dashed {{t.dash}}; color: {{t.muted}}; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>{{it.title}}</div>
            </sc-if>
          </div>
        </li>
      </sc-for>
    </ol>

    <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 8px; border-top: 1px solid {{t.line}}">
      <p style="margin: 0; font-size: 13px; font-weight: 700; color: {{t.muted}}">未註明日期</p>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.line}}">
        <span style="font-size: 15px; font-weight: 700">青翼桌供應商會議筆記</span>
        <span style="font-size: 12px; padding: 2px 8px; border-radius: 6px; background: {{t.primarySoft}}; color: {{t.text}}">上傳</span>
        <span style="font-size: 13px; color: {{t.muted}}">只保留到重新整理頁面為止</span>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { dark: false }; }
  renderVals() {
    const L = { bg: '#F5F6F3', surface: '#FFFFFF', raised: '#EDEFF2', text: '#14171A', muted: '#5B6470', line: '#DDE1E4', primary: '#2340C8', primarySoft: '#E6EAFB', evid: '#E8B800', dash: '#9AA3AE', inkBg: '#14171A', inkFg: '#FFFFFF', conflictSoft: '#FCE8F1', conflictText: '#7A1D50', ePerson: '#3D7AB8', eTeam: '#2E7D5B', eProject: '#7A52C7' };
    const D = { bg: '#0A0D14', surface: '#111621', raised: '#182030', text: '#E7ECF5', muted: '#8B97AD', line: '#253044', primary: '#3EE6D2', primarySoft: '#16302E', evid: '#FFB547', dash: '#3B4A63', inkBg: '#E7ECF5', inkFg: '#0A0D14', conflictSoft: '#2A1420', conflictText: '#FFD3E2', ePerson: '#7FB2EB', eTeam: '#5CC294', eProject: '#B89CF0' };
    const d = this.state.dark;
    const t = d ? D : L;
    const doc = (date, title, vis, lang, match, ent, note) => ({ date, title, vis, lang, doc: true, locked: false, ent: ent || '', hasEnt: !!ent, note: note || '', hasNote: !!note, opacity: match ? '1' : '0.45', dot: match ? t.eProject : t.line });
    const lock = (date, title) => ({ date, title, doc: false, locked: true, hasEnt: false, hasNote: false, dot: t.dash, opacity: '1' });
    return {
      t,
      items: [
        doc('01-05', '員工手冊', '公開', '中', false),
        doc('01-12', '組織與主管名單', '內部', '中', false, '王小明、產品研發部'),
        doc('02-02', '資訊安全規定', '內部', '中', false),
        doc('02-10', '青翼專案啟動會議紀錄', '內部', '中', true, '王小明、周大衛、林志明、產品研發部', '與〈青翼專案進度更新〉的說法不同'),
        doc('05-15', '青翼專案進度更新', '內部', '中', true, '青翼專案', '與〈青翼專案啟動會議紀錄〉的說法不同')
      ],
      modeLabel: d ? 'Dark' : 'Light',
      darkPressed: d ? 'true' : 'false',
      toggleDark: () => this.setState({ dark: !d })
    };
  }
}
</script>
</body>
</html>
