<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>登入</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3EE6D2}a:hover{color:#E7ECF5}
@keyframes kOrbit{0%,100%{transform:rotateY(-9deg) rotateX(5deg)}50%{transform:rotateY(9deg) rotateX(-4deg)}}
@keyframes kPop{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.15)}100%{transform:none}}
@keyframes kFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-5px)}}
@keyframes kTwinkle{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes kDraw{from{stroke-dashoffset:1}}
@keyframes kFadeIn{from{opacity:0}}
@keyframes kTravel{0%{stroke-dashoffset:.08;opacity:0}6%{opacity:1}60%{stroke-dashoffset:-1;opacity:1}61%,100%{stroke-dashoffset:-1;opacity:0}}
@keyframes kForm{0%,8%{stroke-dashoffset:1;opacity:1}24%{stroke-dashoffset:0}70%{stroke-dashoffset:0;opacity:1}85%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes kGlow{0%,100%{box-shadow:0 0 0 4px var(--bg),0 0 0 4px transparent}50%{box-shadow:0 0 0 4px var(--bg),0 0 0 10px var(--glow)}}
.s-scene{position:absolute;inset:0;transform-style:preserve-3d;animation:kOrbit 26s ease-in-out infinite}
.s-layer{position:absolute;inset:0;transform-style:preserve-3d}
.s-pop{animation:kPop 600ms cubic-bezier(.2,0,0,1) backwards}
.s-float{animation:kFloat 6s ease-in-out infinite}
.s-twinkle{animation:kTwinkle 5s ease-in-out infinite}
.s-edge{stroke-dasharray:1;animation:kDraw 900ms cubic-bezier(.2,0,0,1) backwards}
.s-fade{animation:kFadeIn 1200ms cubic-bezier(.2,0,0,1) backwards}
.s-travel{stroke-dasharray:.07 2;stroke-dashoffset:.08;opacity:0;animation:kTravel 4.2s linear infinite backwards}
.s-none{display:none}
.s-form{stroke-dasharray:1;stroke-dashoffset:1;animation:kForm 10s cubic-bezier(.2,0,0,1) infinite backwards}
.s-glow{animation:kGlow 4s ease-in-out infinite}
.s-still *{animation:none !important}
.s-still .s-travel,.s-still .s-form{opacity:0}
@media (prefers-reduced-motion: reduce){.s-hero *{animation:none !important}.s-travel,.s-form{opacity:0}}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, 'Noto Sans TC', sans-serif; display: flex; flex-direction: column; transition: background-color 220ms cubic-bezier(.2,0,0,1), color 220ms cubic-bezier(.2,0,0,1)">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px clamp(16px, 3vw, 40px); border-bottom: 1px solid {{t.line}}">
    <svg width="30" height="30" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="11" fill="{{t.surface}}" stroke="{{t.line}}"></rect><path d="M17 12v24M17 24 32 13.5M17 24l15 10.5" fill="none" stroke="{{t.text}}" stroke-width="4" stroke-linecap="round"></path><circle cx="32" cy="34.5" r="4.75" fill="{{t.primary}}"></circle><circle cx="32" cy="13.5" r="4.75" fill="{{t.evid}}"></circle></svg>
    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700">Knowledge Kit</span>
    <span style="color: {{t.dash}}">/</span>
    <span style="font-size: 14px; color: {{t.muted}}">範例公司</span>
    <span style="display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 6px; border: 1px dashed {{t.dash}}; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{t.muted}}">虛構資料</span>
    <span style="display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 6px; border: 1px dashed {{t.dash}}; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{t.muted}}">展示用權限</span>
    <div style="margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: {{t.muted}}">語言
        <select style="height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.text}}; font: 14px Inter, 'Noto Sans TC', sans-serif"><option>繁體中文</option><option>English</option></select>
      </label>
      <button type="button" onClick="{{toggleStill}}" aria-pressed="{{stillPressed}}" style="height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.text}}; font: 500 12px 'JetBrains Mono', monospace">{{stillLabel}}</button>
      <button type="button" onClick="{{toggleDark}}" aria-pressed="{{darkPressed}}" style="height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.text}}; font: 500 12px 'JetBrains Mono', monospace">{{modeLabel}}</button>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-wrap: wrap; align-items: stretch">

    <div class="s-hero {{stillCls}}" role="img" aria-label="知識圖譜的節點在深處彼此連結，訊號沿著關係流動。" style="position: relative; flex: 999 1 620px; min-height: 760px; overflow: hidden; perspective: 1100px; background: radial-gradient(ellipse at 50% 45%, {{t.core}} 0%, {{t.bg}} 70%); --bg: {{t.bg}}; --glow: {{t.glow}}">
      <div class="s-scene">

        <div class="s-layer" style="transform: translateZ(-520px) scale(1.47); filter: blur(1.2px); opacity: 0.55">
          <sc-for list="{{farEdges}}" as="e" hint-placeholder-count="30">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><line class="s-edge" pathLength="1" x1="{{e.x1}}" y1="{{e.y1}}" x2="{{e.x2}}" y2="{{e.y2}}" stroke="{{t.far}}" stroke-width="1" vector-effect="non-scaling-stroke" style="animation-delay: {{e.delay}}"></line></svg>
          </sc-for>
          <sc-for list="{{farNodes}}" as="n" hint-placeholder-count="26">
            <div class="s-twinkle" style="position: absolute; left: {{n.x}}%; top: {{n.y}}%; width: {{n.size}}; height: {{n.size}}; margin: {{n.m}}; border-radius: 999px; background: {{t.far}}; animation-delay: {{n.delay}}"></div>
          </sc-for>
        </div>

        <div class="s-layer" style="transform: translateZ(-220px) scale(1.2); filter: blur(0.4px); opacity: 0.8">
          <sc-for list="{{midEdges}}" as="e" hint-placeholder-count="20">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><line class="s-edge" pathLength="1" x1="{{e.x1}}" y1="{{e.y1}}" x2="{{e.x2}}" y2="{{e.y2}}" stroke="{{t.mid}}" stroke-width="1" vector-effect="non-scaling-stroke" style="animation-delay: {{e.delay}}"></line><line class="{{e.pulse}}" pathLength="1" x1="{{e.x1}}" y1="{{e.y1}}" x2="{{e.x2}}" y2="{{e.y2}}" stroke="{{t.primary}}" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" style="animation-delay: {{e.pDelay}}"></line></svg>
          </sc-for>
          <sc-for list="{{midNodes}}" as="n" hint-placeholder-count="16">
            <div class="s-pop" style="position: absolute; left: {{n.x}}%; top: {{n.y}}%; width: {{n.size}}; height: {{n.size}}; margin: {{n.m}}; border-radius: {{n.r}}; background: {{n.c}}; opacity: 0.6; animation-delay: {{n.delay}}"></div>
          </sc-for>
        </div>

        <div class="s-layer">
          <sc-for list="{{nearEdges}}" as="e" hint-placeholder-count="15">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><line class="s-edge" pathLength="1" x1="{{e.x1}}" y1="{{e.y1}}" x2="{{e.x2}}" y2="{{e.y2}}" stroke="{{t.edge}}" stroke-width="1.6" vector-effect="non-scaling-stroke" style="animation-delay: {{e.delay}}"></line><line class="{{e.pulse}}" pathLength="1" x1="{{e.x1}}" y1="{{e.y1}}" x2="{{e.x2}}" y2="{{e.y2}}" stroke="{{e.pc}}" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke" style="animation-delay: {{e.pDelay}}"></line></svg>
          </sc-for>
          <sc-for list="{{formEdges}}" as="e" hint-placeholder-count="4">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><line class="s-form" pathLength="1" x1="{{e.x1}}" y1="{{e.y1}}" x2="{{e.x2}}" y2="{{e.y2}}" stroke="{{t.primary}}" stroke-width="1.6" vector-effect="non-scaling-stroke" style="animation-delay: {{e.delay}}"></line></svg>
          </sc-for>
          <sc-for list="{{nearNodes}}" as="n" hint-placeholder-count="14">
            <div style="position: absolute; left: {{n.x}}%; top: {{n.y}}%; width: 0; height: 0">
              <div class="s-float" style="animation-delay: {{n.floatDelay}}; animation-duration: {{n.floatDur}}">
                <div class="s-pop" style="position: absolute; left: {{n.off}}; top: {{n.off}}; width: {{n.size}}; height: {{n.size}}; animation-delay: {{n.delay}}">
                  <div class="{{n.glowCls}}" style="width: 100%; height: 100%; border-radius: {{n.r}}; background: {{n.c}}; box-shadow: 0 0 0 4px {{t.bg}}; animation-delay: {{n.glowDelay}}"></div>
                </div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="flex: 1 1 380px; max-width: 520px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 40px clamp(16px, 3vw, 48px); border-left: 1px solid {{t.line}}; background: {{t.panel}}">

      <sc-if value="{{isAccount}}">
      <form style="display: flex; flex-direction: column; gap: 12px">
        <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: {{t.primary}}">SIGN IN</p>
        <h1 style="margin: 0; font-size: 26px; font-weight: 700">帳號登入</h1>
        <span style="font-size: 13px; font-weight: 600; margin-top: 6px">帳號</span>
        <div role="radiogroup" aria-label="展示帳號" style="display: flex; flex-direction: column; gap: 6px">
          <sc-for list="{{accounts}}" as="a" hint-placeholder-count="3">
            <button type="button" role="radio" aria-checked="{{a.checked}}" onClick="{{a.pick}}" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border-radius: 10px; border: {{a.border}}; background: {{t.surface}}; color: {{t.text}}; text-align: left; cursor: pointer">
              <span style="flex: none; width: 16px; height: 16px; box-sizing: border-box; border-radius: 999px; border: {{a.dot}}"></span>
              <span style="display: flex; flex-direction: column; gap: 1px"><span style="font: 500 15px 'JetBrains Mono', monospace">{{a.mail}}</span><span style="font-size: 12px; color: {{t.muted}}">{{a.role}}</span></span>
            </button>
          </sc-for>
        </div>
        <label for="pw" style="font-size: 13px; font-weight: 600; margin-top: 4px">密碼</label>
        <input id="pw" type="password" disabled placeholder="展示版不需要密碼" style="height: 48px; padding: 0 14px; border-radius: 10px; border: 1px dashed {{t.dash}}; background: transparent; color: {{t.muted}}; font: 500 16px Inter, 'Noto Sans TC', sans-serif">
        <p style="margin: 0; font-size: 13px; line-height: 1.6; color: {{t.muted}}">展示帳號：選了就固定為那個身分，登入後不能切換。輸入的內容不會送出或保存。</p>
        <button type="submit" style="height: 52px; margin-top: 4px; border: 0; border-radius: 10px; background: {{t.primary}}; color: {{t.onPrimary}}; font: 700 16px Inter, 'Noto Sans TC', sans-serif">登入</button>
        <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: {{t.muted}}"><span style="flex: 1; height: 1px; background: {{t.line}}"></span>或<span style="flex: 1; height: 1px; background: {{t.line}}"></span></div>
        <button type="button" onClick="{{toCode}}" style="height: 48px; border-radius: 10px; border: 1px solid {{t.line}}; background: transparent; color: {{t.text}}; font: 600 15px Inter, 'Noto Sans TC', sans-serif">使用邀請碼體驗</button>
      </form>
      </sc-if>

      <sc-if value="{{isCode}}">
      <form style="display: flex; flex-direction: column; gap: 14px">
        <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: {{t.primary}}">ACCESS</p>
        <h1 style="margin: 0; font-size: 26px; font-weight: 700">使用邀請碼體驗</h1>
        <label for="code" style="font-size: 13px; font-weight: 600; margin-top: 8px">邀請碼</label>
        <input id="code" type="text" value="DEMO-OPEN" style="height: 52px; padding: 0 14px; border-radius: 10px; border: 1.5px solid {{t.inputLine}}; background: {{t.surface}}; color: {{t.text}}; font: 500 17px 'JetBrains Mono', monospace; letter-spacing: 0.04em">
        <p style="margin: 0; font-size: 13px; line-height: 1.6; color: {{t.muted}}">與現行相同：邀請碼決定身分，進入後可以切換身分。邀請碼只保存在這個分頁。</p>
        <button type="submit" style="height: 52px; margin-top: 4px; border: 0; border-radius: 10px; background: {{t.primary}}; color: {{t.onPrimary}}; font: 700 16px Inter, 'Noto Sans TC', sans-serif">開始使用</button>
        <button type="button" onClick="{{toAccount}}" style="align-self: flex-start; height: 44px; padding: 0 4px; border: 0; background: transparent; color: {{t.primary}}; font: 600 14px Inter, 'Noto Sans TC', sans-serif">← 改用帳號登入</button>
      </form>
      </sc-if>

      <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 18px; margin-top: 4px; border-top: 1px solid {{t.line}}">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{t.muted}}"><span>SEMANTIC MODEL</span><span>52／84 MB</span></div>
        <div style="height: 4px; border-radius: 999px; background: {{t.line}}; overflow: hidden"><div style="width: 62%; height: 100%; background: {{t.primary}}"></div></div>
        <p style="margin: 0; font-size: 12px; line-height: 1.55; color: {{t.muted}}">登入時同時下載語意模型，登入完成通常就能開始問。</p>
      </div>

      <div style="padding: 12px 14px; border-radius: 10px; border: 1px dashed {{t.dash}}; font-size: 12px; line-height: 1.7; color: {{t.muted}}">設計說明（不在產品中）：{{variantNote}}</div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { dark: true, still: false, variant: 'account', acct: 'staff' }; }
  renderVals() {
    const L = { bg: '#F5F6F3', core: '#FFFFFF', panel: '#FFFFFF', surface: '#FFFFFF', text: '#14171A', muted: '#5B6470', line: '#DDE1E4', inputLine: '#14171A', primary: '#2340C8', glow: 'rgba(35,64,200,0.18)', onPrimary: '#FFFFFF', evid: '#E8B800', dash: '#9AA3AE', edge: '#B9C0C8', mid: '#CDD2D8', far: '#C3C9D0', ePerson: '#3D7AB8', eTeam: '#2E7D5B', eProject: '#7A52C7' };
    const D = { bg: '#070A10', core: '#121A2A', panel: '#0D111A', surface: '#111621', text: '#E7ECF5', muted: '#8B97AD', line: '#1C2433', inputLine: '#3B4A63', primary: '#3EE6D2', glow: 'rgba(62,230,210,0.22)', onPrimary: '#04201D', evid: '#FFB547', dash: '#3B4A63', edge: '#2E3A50', mid: '#26324A', far: '#2A3650', ePerson: '#7FB2EB', eTeam: '#5CC294', eProject: '#B89CF0' };
    const s = this.state;
    const t = s.dark ? D : L;

    let seed = 7;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const field = (count, pad) => Array.from({ length: count }, () => ({ x: +(pad + rnd() * (100 - pad * 2)).toFixed(1), y: +(pad + rnd() * (100 - pad * 2)).toFixed(1) }));
    const link = (pts, k) => {
      const seen = {}, out = [];
      pts.forEach((a, i) => {
        pts.map((b, j) => ({ j, d: Math.hypot((a.x - b.x) * 1.3, a.y - b.y) }))
          .filter((o) => o.j !== i).sort((p, q) => p.d - q.d).slice(0, k)
          .forEach((o) => { const key = Math.min(i, o.j) + '-' + Math.max(i, o.j); if (!seen[key]) { seen[key] = 1; out.push([i, o.j]); } });
      });
      return out;
    };

    const far = field(26, 2);
    const farNodes = far.map((p, i) => ({ x: p.x, y: p.y, size: '5px', m: '-2.5px 0 0 -2.5px', delay: (i * 0.41 % 5).toFixed(2) + 's' }));
    const farEdges = link(far, 2).map(([a, b], i) => ({ x1: far[a].x, y1: far[a].y, x2: far[b].x, y2: far[b].y, delay: (200 + i * 30) + 'ms' }));

    const mid = field(16, 6);
    const kinds = [t.ePerson, t.eTeam, t.eProject];
    const midNodes = mid.map((p, i) => { const sz = 8 + (i % 3) * 2; return { x: p.x, y: p.y, size: sz + 'px', m: (-sz / 2) + 'px 0 0 ' + (-sz / 2) + 'px', r: i % 3 === 0 ? '999px' : (i % 3 === 1 ? '3px' : '2px'), c: kinds[i % 3], delay: (300 + i * 60) + 'ms' }; });
    const midEdges = link(mid, 2).map(([a, b], i) => ({ x1: mid[a].x, y1: mid[a].y, x2: mid[b].x, y2: mid[b].y, delay: (400 + i * 40) + 'ms', pulse: i % 4 === 1 ? 's-travel' : 's-none', pDelay: (2 + i * 0.9).toFixed(1) + 's' }));

    const P = 'p', T = 't', J = 'j';
    const near = [
      [43.5, 42, T], [73.2, 28, J], [25, 28, P], [65.8, 52, P], [36.1, 58, P],
      [62, 76, T], [88, 62, J], [88, 84, P], [43.5, 86, P],
      [88, 12, T], [65.8, 10, P], [13.9, 68, T], [12, 44, P], [17.6, 88, P]
    ];
    const nearNodes = near.map((n, i) => {
      const px = n[2] === P ? 18 : (n[2] === T ? 24 : 28);
      const glow = i === 1 || i === 3 || i === 0;
      return {
        x: n[0], y: n[1], size: px + 'px', off: (-px / 2) + 'px',
        r: n[2] === P ? '999px' : (n[2] === T ? '7px' : '5px'),
        c: n[2] === P ? t.ePerson : (n[2] === T ? t.eTeam : t.eProject),
        delay: (600 + i * 80) + 'ms',
        floatDelay: (i * 0.37).toFixed(2) + 's',
        floatDur: (5 + (i % 4) * 0.8).toFixed(1) + 's',
        glowCls: glow ? 's-glow' : '',
        glowDelay: (i * 1.3).toFixed(1) + 's'
      };
    });
    const pairs = [[2, 0], [3, 0], [4, 0], [13, 11], [10, 9], [7, 5], [8, 5], [12, 11], [2, 1], [7, 6], [3, 1], [4, 1], [8, 6], [0, 1], [5, 6]];
    const pulsed = { 8: [0, t.primary], 10: [2.1, t.evid], 13: [1.0, t.primary], 14: [3.0, t.primary], 6: [1.6, t.primary], 7: [3.6, t.primary], 4: [2.6, t.primary] };
    const nearEdges = pairs.map(([a, b], i) => {
      const p = pulsed[i];
      return { x1: near[a][0], y1: near[a][1], x2: near[b][0], y2: near[b][1], delay: (900 + i * 60) + 'ms', pulse: p ? 's-travel' : 's-none', pDelay: p ? (2 + p[0]).toFixed(1) + 's' : '0s', pc: p ? p[1] : t.primary };
    });
    const forms = [[2, 12], [3, 6], [10, 1], [4, 8]];
    const formEdges = forms.map(([a, b], i) => ({ x1: near[a][0], y1: near[a][1], x2: near[b][0], y2: near[b][1], delay: (3 + i * 2.5) + 's' }));

    return {
      t, farNodes, farEdges, midNodes, midEdges, nearNodes, nearEdges, formEdges,
      isAccount: s.variant === 'account', isCode: s.variant === 'code',
      toCode: () => this.setState({ variant: 'code' }), toAccount: () => this.setState({ variant: 'account' }),
      accounts: [['guest', 'guest@example.test', '訪客'], ['staff', 'staff@example.test', '一般員工'], ['manager', 'manager@example.test', '主管']].map(([k, mail, role]) => ({ mail, role, checked: s.acct === k ? 'true' : 'false', pick: () => this.setState({ acct: k }), border: s.acct === k ? '1.5px solid ' + t.primary : '1px solid ' + t.line, dot: s.acct === k ? '5px solid ' + t.primary : '1.5px solid ' + t.dash })),
      variantNote: s.variant === 'account' ? '帳號登入是展示：帳號欄列出 client/access.json 各角色的虛構展示帳號；fork 時換成客戶真的身分驗證。/api/ask 仍以邀請碼把關：線上 demo 以內建的公開碼送出；沒有公開碼的部署，這裡也要多一個邀請碼欄。' : '使用邀請碼體驗與現行相同，可以切換身分。',
      modeLabel: s.dark ? 'DARK' : 'LIGHT',
      darkPressed: s.dark ? 'true' : 'false',
      toggleDark: () => this.setState({ dark: !s.dark }),
      stillCls: s.still ? 's-still' : '',
      stillLabel: s.still ? 'MOTION OFF' : 'MOTION ON',
      stillPressed: s.still ? 'false' : 'true',
      toggleStill: () => this.setState({ still: !s.still })
    };
  }
}
</script>
</body>
</html>
