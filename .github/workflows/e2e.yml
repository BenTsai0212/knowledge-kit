# Playwright（#66，ADR 0004；說明見 docs/testing.md）。push 到 main 後執行，另可用 workflow_dispatch 對分支手動執行。
# 不使用任何 secret：/api/ask 一律由測試以 page.route 回傳假的回應。失敗時上傳 trace 與截圖。
# 參考情境 client/ 與 clients/ 底下的每個客戶各跑一格（#77），另以線上 demo 的設定跑參考情境一格（#100）；略過的測試與原因寫在 job summary，參考情境有略過時失敗。
name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      clients: ${{ steps.list.outputs.clients }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        name: 列出客戶
        # "" 是參考情境；其餘是 clients/ 底下的資料夾（與 scripts/check-clients.mjs 的 listClients() 相同）
        run: |
          clients=$(node --input-type=module -e 'import { listClients } from "./scripts/check-clients.mjs"; console.log(JSON.stringify(["", ...listClients()]))')
          echo "clients=$clients" >> "$GITHUB_OUTPUT"

  playwright:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJSON(needs.list.outputs.clients) }}
    name: playwright (${{ matrix.client || 'client' }})
    env:
      KK_CLIENT: ${{ matrix.client }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 安裝
        run: npm ci
      - name: build
        run: npm run build
      - name: 安裝 Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test
      - name: 上傳 trace 與截圖
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.client || 'client' }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  # 線上 demo 的設定（#100）：參考情境以 VITE_ONLINE_DEMO=1 build，只執行 e2e/demo.spec.ts（playwright.config.ts）。
  # 公開試用碼是測試用的虛構值，build 與測試用同一個值
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: playwright (online demo)
    env:
      VITE_ONLINE_DEMO: "1"
      VITE_PUBLIC_ACCESS_CODE: e2e-public-code
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 安裝
        run: npm ci
      - name: build
        run: npm run build
      - name: 安裝 Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test
      - name: 上傳 trace 與截圖
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-online-demo
          path: |
            test-results/
            playwright-report/
          retention-days: 14
